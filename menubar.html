<!DOCTYPE html>
<html>
<head>
  <title>Menu Bar</title>
  <style>
    body {
      background-image: url("logo.png");
      background-size: 300px 300px;   /* size of logo */
      background-repeat: no-repeat;
      background-position: center;
      background-attachment: fixed;  /* stays like a back cover */
      background-color: black;       /* matches your logo theme */

      font-family: Arial, sans-serif;
      text-align: center;
      color: white;
    }

    h2 {
      margin-top: 50px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      margin: 10px;
    }

    button {
      width: 150px;
      padding: 10px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: white;
    }

    .home { background-color: #27ae60; }
    .about { background-color: #2980b9; }
    .contact { background-color: #e74c3c; }
  </style>
</head>
<body>

  <h2>Welcome to My Website</h2>

  <ul>
    <li><button class="home">Home</button></li>
    <li><button class="about">About</button></li>
    <li><button class="contact">Contact</button></li>
  </ul>

</body>
</html>
